name: Proponi appuntamento

# Avviata dall'app (Calendario -> proponi appuntamento): aggiunge una voce
# a appuntamenti.json come proposta di Pull Request, invece di scriverla
# subito su main.
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Titolo dell'appuntamento (es. Prova coro)"
        required: true
      date:
        description: "Data in formato AAAA-MM-GG"
        required: true
      time:
        description: "Orario in formato HH:mm (facoltativo)"
        required: false
      location:
        description: "Luogo (facoltativo)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest include jq preinstallato: usato qui per costruire
      # correttamente il nuovo oggetto JSON (con "time"/"location" solo se
      # indicati) e aggiungerlo all'array esistente, invece di manipolare
      # il file come testo semplice — così appuntamenti.json resta sempre
      # JSON valido anche se un valore contenesse virgolette o altri
      # caratteri speciali.
      - name: Aggiunge la voce a appuntamenti.json
        env:
          TITLE: ${{ inputs.title }}
          DATE: ${{ inputs.date }}
          TIME: ${{ inputs.time }}
          LOCATION: ${{ inputs.location }}
        run: |
          if [ ! -f appuntamenti.json ]; then
            echo "[]" > appuntamenti.json
          fi
          jq --arg title "$TITLE" --arg date "$DATE" --arg time "$TIME" --arg location "$LOCATION" \
            '. + [
              {title: $title, date: $date}
              + (if $time != "" then {time: $time} else {} end)
              + (if $location != "" then {location: $location} else {} end)
            ]' \
            appuntamenti.json > appuntamenti.tmp
          mv appuntamenti.tmp appuntamenti.json

      - name: Calcola un nome di branch valido
        id: branch
        env:
          TITLE: ${{ inputs.title }}
        run: |
          SLUG=$(echo "$TITLE" | tr -c 'a-zA-Z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          echo "slug=appuntamento-$SLUG-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Apre la Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Proposta appuntamento: ${{ inputs.title }} (${{ inputs.date }})"
          title: "Proposta appuntamento: ${{ inputs.title }} — ${{ inputs.date }}"
          body: |
            Proposta ricevuta dall'app "Libretto Cantori Fornaciari".

            Controlla il diff prima di fare merge — questa PR non viene
            unita automaticamente.
          branch: ${{ steps.branch.outputs.slug }}
          add-paths: appuntamenti.json
