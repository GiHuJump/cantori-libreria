name: Proponi tag per un canto

# Avviata dall'app (dettaglio di un canto -> proponi tag momento/tempo
# liturgico/sacramento): aggiunge una riga "{meta: ...}" a un canto già
# esistente nella libreria, proponendola come Pull Request invece di
# scriverla subito su main.
on:
  workflow_dispatch:
    inputs:
      fileName:
        description: "Nome del file del canto già in libreria (es. Gloria.cho)"
        required: true
      metaName:
        description: "Nome del tag (es. momento, tempo_liturgico, sacramento)"
        required: true
      metaValue:
        description: "Valore proposto (es. Ingresso)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica che il nome file sia sicuro e che il canto esista
        run: |
          FILE_NAME="${{ inputs.fileName }}"
          if [[ "$FILE_NAME" == *"/"* || "$FILE_NAME" == *".."* ]]; then
            echo "Nome file non valido: $FILE_NAME"
            exit 1
          fi
          if [ ! -f "$FILE_NAME" ]; then
            echo "Il canto '$FILE_NAME' non esiste in libreria: nessun tag da aggiungere."
            exit 1
          fi

      # "metaName"/"metaValue" arrivano da un utente dell'app: qui si
      # scartano eventuali "a capo" che, incollati così com'è nella riga
      # {meta: ...}, spezzerebbero quella riga in più righe non valide.
      #
      # La riga va inserita SUBITO DOPO l'intestazione del file (le righe
      # {...} e vuote in cima, es. {title:}/{artist:}/altri {meta:}), non
      # in fondo a tutto il canto: un semplice ">> file" (append) in fondo
      # aveva due problemi — se il file non terminava già con un "a capo"
      # la riga del tag finiva incollata alla fine dell'ultima riga di
      # testo invece che su una riga propria (l'app poi non la
      # riconosceva più come direttiva valida), e comunque un tag in
      # fondo a tutto il canto, dopo ritornelli e strofe, è nel posto
      # sbagliato per chiunque apra il file. awk riscrive qui l'intero
      # file riga per riga (quindi ogni riga, compresa quella nuova,
      # finisce sempre con un "a capo" pulito) inserendo la riga del tag
      # subito prima della prima riga che non è né vuota né una direttiva
      # — cioè subito prima che inizi il testo vero e proprio del canto.
      - name: Aggiunge la riga del tag (se non già presente)
        env:
          FILE_NAME: ${{ inputs.fileName }}
          META_NAME: ${{ inputs.metaName }}
          META_VALUE: ${{ inputs.metaValue }}
        run: |
          SAFE_NAME=$(echo "$META_NAME" | tr -d '\n\r')
          SAFE_VALUE=$(echo "$META_VALUE" | tr -d '\n\r')
          LINE="{meta: $SAFE_NAME $SAFE_VALUE}"
          if grep -qF "$LINE" "$FILE_NAME"; then
            echo "Il tag è già presente, niente da proporre."
            echo "already_present=true" >> "$GITHUB_ENV"
          else
            awk -v line="$LINE" '
              !inserted && $0 !~ /^\{.*\}[ \t]*$/ && $0 !~ /^[ \t]*$/ {
                print line
                inserted = 1
              }
              { print }
              END { if (!inserted) print line }
            ' "$FILE_NAME" > "$FILE_NAME.tmp"
            mv "$FILE_NAME.tmp" "$FILE_NAME"
            echo "already_present=false" >> "$GITHUB_ENV"
          fi

      - name: Calcola un nome di branch valido
        if: env.already_present == 'false'
        id: branch
        env:
          FILE_NAME: ${{ inputs.fileName }}
        run: |
          SLUG=$(echo "$FILE_NAME" | tr -c 'a-zA-Z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          echo "slug=tag-$SLUG-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Apre la Pull Request
        if: env.already_present == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Proposta tag ${{ inputs.metaName }} per ${{ inputs.fileName }}"
          title: "Proposta tag: ${{ inputs.fileName }} — ${{ inputs.metaName }} ${{ inputs.metaValue }}"
          body: |
            Proposta ricevuta dall'app "Libretto Cantori Fornaciari".

            Controlla il diff prima di fare merge — questa PR non viene
            unita automaticamente.
          branch: ${{ steps.branch.outputs.slug }}
          add-paths: ${{ inputs.fileName }}
